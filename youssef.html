<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yousef Fouad – Private Tours in Egypt | يوسف فؤاد</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Marcellus&display=swap">
<style>
:root{--bg:#f6f3ec;--ink:#14233b;--muted:#586377;--card:#fff;--line:#e2dac8;--lapis:#14305c;--gold:#d9a441;--teal:#1f8a86;--field:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1526;--ink:#eef0f4;--muted:#a3adbf;--card:#16223a;--line:#2a3855;--field:#0d1526;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1526;--ink:#eef0f4;--muted:#a3adbf;--card:#16223a;--line:#2a3855;--field:#0d1526;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 Cairo,system-ui,sans-serif}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:Marcellus,Cairo,serif;font-weight:400;line-height:1.15;margin:0}
.btn{display:inline-block;padding:13px 24px;border-radius:999px;font-weight:800;text-decoration:none;border:2px solid var(--gold);cursor:pointer;font-family:inherit;font-size:1rem;background:var(--gold);color:#14233b}
.btn.ghost{background:transparent;color:inherit;border-color:currentColor}
/* hero */
.hero{background:linear-gradient(180deg,#0f2447 0%,#14305c 55%,#2b4f7e 100%);color:#fff;position:relative;overflow:hidden}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0}
.brand{font-family:Marcellus,Cairo,serif;font-size:1.3rem;text-decoration:none}
.nav nav{display:flex;gap:18px;align-items:center;font-weight:600;font-size:.95rem}
.nav nav a{text-decoration:none;opacity:.9}
#lang{background:none;border:1px solid #fff8;color:#fff;border-radius:999px;padding:4px 14px;font:inherit;cursor:pointer}
.hero-body{padding:56px 0 190px;max-width:680px}
.hero h1{font-size:clamp(2.4rem,7vw,4.6rem);letter-spacing:-.01em}
.hero p{font-size:1.15rem;max-width:34em;opacity:.92;margin:18px 0 28px}
.hero .btns{display:flex;gap:12px;flex-wrap:wrap}
.scene{position:absolute;inset:auto 0 0 0;width:100%;height:230px;display:block}
/* sections */
section{padding:64px 0}
h2{font-size:clamp(1.8rem,4.5vw,2.6rem);margin-bottom:10px}
.lead{color:var(--muted);margin:0 0 30px;max-width:40em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card svg{width:100%;height:auto;display:block}
.card .in{padding:16px 18px 20px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:1.3rem}
.card .meta{color:var(--teal);font-weight:600;font-size:.9rem}
.card p{margin:0;color:var(--muted);font-size:.95rem;flex:1}
.price{font-size:2rem;font-family:Marcellus,Cairo,serif;margin-top:8px}
.price small{font-family:Cairo,sans-serif;font-size:.8rem;color:var(--muted)}
.card .btn{margin-top:10px;text-align:center;padding:10px 16px}
.pay{background:var(--lapis);color:#fff}
.pay .lead{color:#c9d3e6}
.pay .card{background:#ffffff12;border-color:#ffffff30;border-radius:6px 22px 6px 22px;padding:22px}
.pay .card p{color:#d5dded}
.pay h3{margin-bottom:8px}
.pay .btn{margin-top:14px;align-self:flex-start}
/* contact */
.contact{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:36px;align-items:start}
.ways a.row{display:block;padding:16px 0;border-bottom:1px solid var(--line);text-decoration:none}
.ways small{display:block;color:var(--muted)}
.ways strong{font-size:1.25rem}
label{display:block;font-weight:600;font-size:.9rem;margin:0 0 12px}
input,select,textarea{width:100%;margin-top:4px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);font:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acts{display:flex;gap:10px;flex-wrap:wrap}
footer{padding:26px 0;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem;text-align:center}
@media(max-width:560px){.nav nav a{display:none}.hero-body{padding-bottom:160px}.two{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

<main>

      <a class="row" id="mailLink" href="#"><small data-t="ml"></small><strong id="mailShow"></strong></a>

</div></section>
</main>

let L='en';
const $=id=>document.getElementById(id);
function render(){
  const t=T[L],root=document.documentElement;
  root.lang=L;root.dir=L==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t[e.dataset.t]);
  $('cards').innerHTML=t.trips.map((x,i)=>`<article class="card">${scenes[i]}<div class="in"><h3>${x[0]}</h3><span class="meta">${x[1]}</span><p>${x[2]}</p><div class="price">$${x[3]} <small>${t.per}</small></div><a class="btn" href="#contact" data-pick="${i}">${t.book}</a></div></article>`).join('');
  const sel=$('trip'),keep=sel.selectedIndex<0?0:sel.selectedIndex;
  sel.innerHTML=t.trips.map((x,i)=>`<option>${x[0]} ($${x[3]})</option>`).join('');sel.selectedIndex=keep;
  $('lang').textContent=L==='ar'?'English':'عربي';
  document.querySelectorAll('[data-pick]').forEach(a=>a.onclick=()=>{sel.selectedIndex=+a.dataset.pick});
}
function wa(text){return `https://wa.me/${CFG.wa}?text=${encodeURIComponent(text)}`}
function body(){return T[L].msg($('trip').value,$('name').value,$('date').value,$('guests').value)}
$('lang').onclick=()=>{L=L==='en'?'ar':'en';render();setLinks()};
function setLinks(){
  const h=wa(T[L].hi);
  ['waHero','waPay','waLink'].forEach(id=>{$(id).href=h;$(id).target='_blank';$(id).rel='noopener'});
}
$('sendWa').onclick=()=>window.open(wa(body()),'_blank');
$('sendMail').onclick=()=>{location.href=`mailto:${CFG.email}?subject=${encodeURIComponent(T[L].subj)}&body=${encodeURIComponent(body())}`};

$('mailShow').textContent=CFG.email;$('mailLink').href='mailto:'+CFG.email;
$('pp').href=CFG.paypal;
render();setLinks();
